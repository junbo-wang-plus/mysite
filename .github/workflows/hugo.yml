name: Deploy Hugo site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Shrink oversized photos (scripts/shrink-images.py) before building, and
      # commit the smaller files back so the repo stays small too. Pushes made
      # with the workflow's own token don't start another run.
      - name: Shrink large photos
        run: |
          pip install --quiet pillow
          python3 scripts/shrink-images.py
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -q -m "Shrink large photos"
            git push origin HEAD:main || echo "::warning::Couldn't push shrunk photos (main moved on); the next deploy will retry."
          fi
      - uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true
      - run: hugo --minify
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
