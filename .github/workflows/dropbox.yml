name: Publish from Dropbox
on:
  workflow_dispatch:        # "Run workflow" button (works from the GitHub mobile app)
  schedule:
    - cron: '17 * * * *'    # also check Dropbox once an hour
permissions:
  contents: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
      - name: Pull posts from Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: scripts/sync-dropbox.sh
      - name: Commit changes
        id: commit
        run: |
          git add -A content/posts
          if git diff --cached --quiet; then
            echo "No changes in Dropbox."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync posts from Dropbox"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made by this workflow don't trigger hugo.yml, so build & deploy here.
      - uses: peaceiris/actions-hugo@v2
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          hugo-version: 'latest'
          extended: true
      - if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: hugo --minify
      - uses: peaceiris/actions-gh-pages@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
