baseURL = "https://junbowang.com"
title = "Junbo Wang"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
  pagerSize = 12

[params]
  description = ""
  author = "Junbo Wang"
  defaultTheme = "auto"
  ShowReadingTime = false
  hideAuthor = true        # date only above post titles
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = false
  ShowToc = false
  disableHLJS = true

  [params.cover]
    linkFullImages = false
    responsiveImages = false
    hiddenInSingle = true   # cover.image is the grid thumbnail; not repeated on the post page

