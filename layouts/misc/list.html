{{- /*
  Misc section (content/misc/): a plain list of odd things on the site, by
  title. Order by `weight`.
*/ -}}
{{- define "main" }}
<article class="post-single misc">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
  </header>
  <ul class="misc-list">
    {{- range .Pages.ByWeight }}
    <li>
      <a href="{{ .RelPermalink }}"><span class="misc-title">{{ .Title }}</span></a>
    </li>
    {{- end }}
  </ul>
</article>
{{- end }}{{- /* end main */ -}}
