{{- /* Reading-progress bar on single posts. */ -}}
{{- if .IsPage }}
<div class="read-progress" aria-hidden="true"></div>
<script>
(function () {
  var bar = document.querySelector('.read-progress');
  if (!bar) return;
  function update() {
    var d = document.documentElement;
    var max = Math.max(1, d.scrollHeight - window.innerHeight);
    bar.style.width = Math.min(100, Math.max(0, window.scrollY / max * 100)) + '%';
  }
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
})();
</script>
{{- end }}
{{- /* Mark the header once the page is scrolled, to hide the menu tabs. */ -}}
<script>
(function () {
  var header = document.querySelector('.header');
  if (!header) return;
  function update() { header.classList.toggle('scrolled', window.scrollY > 40); }
  window.addEventListener('scroll', update, { passive: true });
  update();
})();
</script>
