{{- /* Reading-progress bar on single posts. */ -}}
{{- if .IsPage }}
<div class="read-progress" aria-hidden="true"></div>
<script>
(function () {
  var bar = document.querySelector('.read-progress');
  if (!bar) return;
  function update() {
    var d = document.documentElement;
    var max = Math.max(1, d.scrollHeight - window.innerHeight);
    bar.style.width = Math.min(100, Math.max(0, window.scrollY / max * 100)) + '%';
  }
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
})();
</script>
{{- end }}
{{- /* Mark the header while scrolling down, to hide the menu tabs; any
   scroll back up (or reaching the top) brings them back. */ -}}
<script>
(function () {
  var header = document.querySelector('.header');
  if (!header) return;
  var last = window.scrollY;
  function update() {
    var y = window.scrollY, dy = y - last;
    if (y <= 40) header.classList.remove('scrolled');
    else if (dy > 4) header.classList.add('scrolled');
    else if (dy < -4) header.classList.remove('scrolled');
    else return;                    // ignore jitter; keep `last` as the reference
    last = y;
  }
  window.addEventListener('scroll', update, { passive: true });
  if (last > 40) header.classList.add('scrolled');
})();
</script>
