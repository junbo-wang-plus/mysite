experience:
  - org: University of Bergen
    role: PhD Candidate
    dates: Sep 2024 – present
    place: Bergen, Norway
    points:
      - Ongoing project developing theoretical models on wave–bathymetry interaction
      - Developed theoretical models for predicting the nonlinear wave–wave and wave–bathymetry interactions near the coast
      - Constructed an envelope-type second-order phase-resolved numerical solver for surface gravity waves
      - Performed statistical analysis on wave measurements obtained by a stereo-camera system in the open ocean
      - Developed and tested a low-cost in-situ ship-board stereo-camera system for measuring wave heights
      - Supervised by Dr. Henrik Kalisch and Dr. Øyvind Breivik

  - org: One Ocean Expedition, UN Ocean Decade
    role: Field Course Participant
    note: Organized by the University of Bergen
    dates: Jul – Aug 2025
    place: Azores – Greenland
    points:
      - Sailed aboard the Norwegian tallship *Statsraad Lehmkuhl* from Ponta Delgada, Azores to Nuuk, Greenland, participating in workshops and scientific activities across the North Atlantic
      - Attended and presented at associated workshops in Ponta Delgada, Nuuk, and Bergen (One Ocean Week 2026)
      - Conducted shipboard research validating surface drifter trajectories and wave measurements against satellite observations and spectral wave models using statistical methods
      - Participated in an open ship event during One Ocean Week 2026, disseminating ocean research activities to Norwegian upper secondary and high school students

  - org: University of California, Los Angeles
    role: Research Data Analyst II
    dates: Apr 2024 – Jul 2024
    place: Los Angeles, CA
    points:
      - Project on performance evaluation of respiratory protection for firefighters responding to wildland–urban interface fires
      - Used CAD and 3D printing to fabricate cartridge-specific connectors for the experimental apparatus
      - Project overseen by Dr. Rachael Jones and Dr. Candace Su-Jung Tsai, funded by The California Climate Action Seed and Matching Grants

  - org: University of California, Los Angeles
    role: Graduate Student Researcher (GSR)
    dates: Jan 2023 – Mar 2024
    place: Los Angeles, CA
    points:
      - Developed a wearable respirable particle sampler with direct-reading capabilities for occupational health
      - Performed numerical simulations (CFD) to optimize sampler performance
      - Used CAD and 3D printing to design and construct prototypes
      - Conducted lab experiments to calibrate sensor fusion algorithms in simulated operating environments
      - Supervised by Dr. Candace Su-Jung Tsai, funded by the National Institute for Occupational Safety & Health (NIOSH)

  - org: Waseda University & Rice University
    role: Team for Advanced Flow Simulation and Modeling (T*AFSM)
    note: Joint research lab led by Kenji Takizawa (Waseda University) and Tayfun E. Tezduyar (Rice University)
    dates: Apr 2020 – Sep 2022
    place: Tokyo, Japan
    points:
      - Investigated subsonic and supersonic flow around spacecraft capsules upon reentry into the atmosphere
      - Performed numerical simulations (CFD) using an in-house solver on a supercomputer (TACC)
      - Graduation thesis on aerodynamics of supersonic spacecraft–parachute systems

  - org: University of Siegen, Tohoku University & Waseda University
